# Optional read-only CUSTOM profile mount. Default Compose already includes
# Orca2.3.0 + tracked profiles/finder2; this file is NOT required to Slice.
# docker compose -f docker-compose.yml -f compose.slicing.yml up --build -d
services:
  finder-web:
    platform: linux/amd64
    build:
      target: slicer
    image: localhost/finderlab-web-slicer:local
    mem_limit: 4g
    environment:
      FINDER_ENABLE_SLICING: "true"
      OMP_NUM_THREADS: "2"
    volumes:
      - type: bind
        source: ${FINDER_PROFILE_DIR:-./profiles/finder2}
        target: /profiles
        read_only: true
        bind:
          create_host_path: false
