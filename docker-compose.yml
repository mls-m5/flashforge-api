# Standalone loopback workbench. OctoPrint is paused: see compose.octoprint.yml.
# Orca is not bundled in this initial image. See docs/WEB.md for native slicing.
services:
  finder-web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    image: localhost/finderlab-web:local
    network_mode: host
    restart: "no"
    volumes:
      - web-data:/app/web-data
      - web-scratch:/app/.tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 1g
    # Uploads remain disabled unless --enable-upload is explicitly added.
    # Start/Cancel independently require --enable-job-controls and confirmation.
    # No serial devices, Docker/Podman socket, privileged mode or host directories.
volumes:
  web-data:
  web-scratch:
