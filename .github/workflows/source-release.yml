name: Source release

on:
  workflow_dispatch:
  push:
    branches:
      - '**'
    tags:
      - '**'

permissions:
  contents: read

jobs:
  tests:
    if: ${{ github.event_name != 'push' || github.event.deleted == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - name: Check out committed source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false

      - name: Set up test Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Set up test Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run Python, UI and trace checks
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p .tmp
          ./tools/check.sh --jobs 4 2>&1 | tee .tmp/ci-checks.log

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checks-python-${{ matrix.python }}-${{ github.sha }}
          path: .tmp/ci-checks.log
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  package:
    needs: tests
    if: ${{ github.event_name != 'push' || github.event.deleted == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out committed source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false

      - name: Set up packaging Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Package source without rerunning tests
        shell: bash
        run: |
          set -euo pipefail
          ./tools/package_release.sh
          commit="$(git rev-parse HEAD)"
          name="finderlab-${commit:0:12}"
          directory="dist/releases/$name"
          git archive --format=zip --prefix=finderlab/ --output="$directory/$name.zip" HEAD
          (cd "$directory" && sha256sum "$name.zip" >> SHA256SUMS)
          echo "CI checks passed before packaging. Source archives only; no container was built." >> "$GITHUB_STEP_SUMMARY"
          if [[ "$GITHUB_REF_TYPE" != tag && "$GITHUB_EVENT_NAME" != workflow_dispatch ]]; then
            echo "Branch push: ZIP built for validation only; source archives are not uploaded." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload source archives and checksums
        if: ${{ github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: finderlab-source-${{ github.sha }}
          path: dist/releases/*/
          if-no-files-found: error
          retention-days: 14

      - name: Upload packaging diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packaging-log-${{ github.sha }}
          path: .tmp/package-logs/*.log
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  release:
    needs: package
    if: ${{ github.event_name == 'push' && github.ref_type == 'tag' && github.event.created == true && github.event.deleted == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download this run's source archives
        uses: actions/download-artifact@v4
        with:
          name: finderlab-source-${{ github.sha }}
          path: .tmp/release-assets

      - name: Create release with verified source assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mapfile -t archives < <(find .tmp/release-assets -type f -name '*.tar.gz')
          if [[ "${#archives[@]}" != 1 ]]; then
            echo "Expected exactly one source tar.gz from this run" >&2
            exit 1
          fi
          directory="$(dirname -- "${archives[0]}")"
          name="$(basename -- "${archives[0]}" .tar.gz)"
          cd "$directory"
          sha256sum -c SHA256SUMS
          gh release create --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
            --title "$RELEASE_TAG" --generate-notes -- "$RELEASE_TAG" \
            "$name.tar.gz" "$name.zip" SHA256SUMS release.json
          gh release edit --repo "$GITHUB_REPOSITORY" --draft=false -- "$RELEASE_TAG"
